{% extends 'base.html' %}

{% block title %}{{ verb }} — Conjii{% endblock %}

{% block content %}
<div class="page">
    <a href="{{ url_for('conjugation') }}" class="back">&larr; Another verb</a>
    <div class="page-head">
        <div>
            <p class="eyebrow">{{ tense }}</p>
            <h1><em>{{ verb }}</em></h1>
        </div>
        <div class="actions">
            <button type="button" class="btn ghost sm" id="speak-verb-btn">Listen to verb</button>
            <button type="button" class="btn sm" id="speak-all-btn">Read all forms</button>
        </div>
    </div>

    <div id="raw" class="hidden">{{ result }}</div>
    <div id="out" class="prose"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    const out = document.getElementById("out");
    out.innerHTML = marked.parse(document.getElementById("raw").textContent);

    // Add a subtle listen button to each conjugation row
    const rows = out.querySelectorAll("tbody tr");
    const rowPhrases = [];
    rows.forEach(tr => {
        const cells = tr.querySelectorAll("td");
        if (cells.length >= 2) {
            const pronoun = cells[0].textContent.trim();
            const form = cells[1].textContent.trim();
            const phrase = (pronoun.split("/")[0].trim() + " " + form).replace(/^je\s+([aeiouéèêàâùûîïœh])/i, "j'$1");
            rowPhrases.push(phrase);

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "replay";
            btn.title = "Listen";
            btn.textContent = "♪";
            btn.addEventListener("click", () => window.ConjiiVoice.speak(phrase));
            cells[1].appendChild(btn);
        }
    });

    document.getElementById("speak-verb-btn").addEventListener("click", () => {
        window.ConjiiVoice.speak({{ verb|tojson }});
    });

    document.getElementById("speak-all-btn").addEventListener("click", () => {
        const text = rowPhrases.length ? rowPhrases.join(", ") : {{ verb|tojson }};
        window.ConjiiVoice.speak(text);
    });
</script>
{% endblock %}
